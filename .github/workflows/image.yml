name: image

on:
  workflow_dispatch:

permissions: {}

env:
  REPOSITORY: ghcr.io/dalito/postgres-rdkit
  RDKIT_GIT_REF: Release_2026_03_1

jobs:
  build-push:
    # Other refs carry other Dockerfiles.
    if: github.ref == 'refs/heads/pg18-rdkit-2026_03_1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build
        run: |
          docker build -f Dockerfile \
              --platform linux/amd64 \
              --build-arg postgres_version=18 \
              --build-arg boost_dev_version=1.88 \
              --build-arg boost_version=1.88 \
              --build-arg rdkit_git_ref="$RDKIT_GIT_REF" \
              --tag postgres-rdkit:build .

      # The tag names the PostgreSQL release the image carries, read from the
      # image itself, so a new base gets a new tag.
      - name: Name the image
        id: name
        run: |
          pg_version=$(docker run --rm --entrypoint postgres postgres-rdkit:build -V | awk '{print $3}')
          echo "image=$REPOSITORY:pg${pg_version}-rdkit_${RDKIT_GIT_REF#Release_}" >> "$GITHUB_OUTPUT"

      # Consumers pin a tag's digest; overwriting the tag would leave its name
      # on an image they do not run.
      - name: Refuse to overwrite a published tag
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          if found=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE is already published"
            exit 1
          fi
          case "$found" in
            *"not found"*) ;;
            *) echo "::error::cannot tell whether $IMAGE exists: $found"; exit 1 ;;
          esac

      - name: Push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker tag postgres-rdkit:build "$IMAGE"
          docker push "$IMAGE"

      - name: Show pushed digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: docker buildx imagetools inspect "$IMAGE"
